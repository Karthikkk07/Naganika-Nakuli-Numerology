<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Login | Naganika, Nakuli Numerology</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#1f2933;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
form{background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 14px rgba(31,41,51,.12);width:min(360px,92vw)}
h1{margin:0 0 18px;font-size:1.3rem;color:#1d4ed8}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.9rem}
input{width:100%;padding:10px 12px;border:1px solid #cbd2d9;border-radius:8px;font:inherit;box-sizing:border-box}
button{margin-top:18px;width:100%;background:#f59e0b;border:0;padding:11px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;color:#1f2933}
#err{color:#b3261e;min-height:1.2em;margin-top:12px;font-size:.9rem}
</style>
</head>
<body>
<form id="f">
  <img src="/img/logo.png" alt="" style="height:48px;display:block;margin:0 auto 10px">
  <h1>Admin Login</h1>
  <label for="u">Username</label><input id="u" autocomplete="username" value="admin">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" autofocus>
  <button type="submit">Sign in</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.ok) location.href = '/admin/'; else document.getElementById('err').textContent = d.error || 'Login failed.'; })
    .catch(function () { document.getElementById('err').textContent = 'Network error.'; });
});
</script>
</body>
</html>
