<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Naganika, Nakuli Numerology</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-title"><div class="wrap"><h1>Gallery</h1></div></div>
<section class="block">
  <div class="wrap">
    <div class="filters">
      <button class="on" data-f="all">All</button>
      <button data-f="events">Events</button>
      <button data-f="consultations">Consultations</button>
      <button data-f="testimonials">Testimonials</button>
    </div>
    <div class="grid grid4 gallery">
      <div data-cat="events"><img src="img/ritual-portrait.jpg" alt="Ritual photograph" data-lightbox="img/ritual-portrait.jpg" loading="lazy"></div>
      <div data-cat="events"><img src="img/ritual-group.jpg" alt="Group photograph at ritual venue" data-lightbox="img/ritual-group.jpg" loading="lazy"></div>
      <div data-cat="events"><img src="img/ritual-fire.jpg" alt="Ritual preparation photograph" data-lightbox="img/ritual-fire.jpg" loading="lazy"></div>
      <div data-cat="consultations"><img src="img/certificate-presentation.jpg" alt="Certificate presentation" data-lightbox="img/certificate-presentation.jpg" loading="lazy"></div>
      <div data-cat="consultations"><img src="img/number9.jpg" alt="Number 9 infographic" data-lightbox="img/number9.jpg" loading="lazy"></div>
      <div data-cat="testimonials"><img src="img/cert1.jpg" alt="Certificate 1" data-lightbox="img/cert1.jpg" loading="lazy"></div>
      <div data-cat="testimonials"><img src="img/cert2.jpg" alt="Certificate 2" data-lightbox="img/cert2.jpg" loading="lazy"></div>
      <div data-cat="testimonials"><img src="img/cert3.jpg" alt="Certificate 3" data-lightbox="img/cert3.jpg" loading="lazy"></div>
    </div>
    <p class="muted">To add photos: copy them into <code>public/img</code> and add another line in this file.</p>
  </div>
</section>
<script src="js/main.js"></script>
</body>
</html>
