<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | Naganika, Nakuli Numerology</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-title"><div class="wrap"><h1>Contact Us &amp; Enquiry</h1></div></div>
<section class="block">
  <div class="wrap grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start">
    <div>
      <h2>Send an Enquiry</h2>
      <form id="f" class="card" novalidate>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="field"><label for="name">Full name *</label><input id="name" name="name" autocomplete="name"><div class="err" data-e="name"></div></div>
        <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email"><div class="err" data-e="email"></div></div>
        <div class="field"><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="9845610894"><div class="err" data-e="phone"></div></div>
        <div class="otp-box">
          <div><label for="otp">Verify phone by OTP (optional)</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code"></div>
          <button type="button" class="btn dark" id="otp-send">Send code</button>
          <button type="button" class="btn dark" id="otp-verify">Verify</button>
        </div>
        <div class="msg" id="otp-msg"></div>
        <div class="field"><label for="service">Service *</label><select id="service" name="service"><option value="">Choose a service</option></select><div class="err" data-e="service"></div></div>
        <div class="row">
          <div class="field"><label for="mode">Preferred mode</label><select id="mode" name="mode"><option>Face to face</option><option>WhatsApp</option><option>Phone call</option></select></div>
          <div class="field"><label for="dob">Date of birth</label><input id="dob" name="dob" type="date"></div>
          <div class="field"><label for="date">Preferred date</label><input id="date" name="date" type="date"></div>
        </div>
        <div class="field"><label for="message">Your query *</label><textarea id="message" name="message" rows="4"></textarea><div class="err" data-e="message"></div></div>
        <button class="btn" type="submit" id="submit">Send Enquiry</button>
        <div class="msg" id="msg"></div>
      </form>
    </div>
    <div>
      <h2>Our Details</h2>
      <div class="card">
        <p><b>Address</b><br>2, P2, 4th Floor, No. 95, Gold Signature, Mosque Road, Fraser Town, Bengaluru, Karnataka - 560005</p>
        <p><b>Phone</b><br><a href="tel:+919845610894">9845610894</a></p>
        <p><b>WhatsApp</b><br><a href="https://wa.me/919845610894" target="_blank" rel="noopener">Chat now</a></p>
        <p><b>Email</b><br><a href="mailto:anand@arninvest.in">anand@arninvest.in</a></p>
        <p><b>Hours</b><br>Mon-Sat, 10:00 AM - 7:00 PM (please confirm by call)</p>
      </div>
      <iframe class="map" style="margin-top:16px" loading="lazy" title="Office location"
        src="https://maps.google.com/maps?q=Gold%20Signature%2C%20Mosque%20Road%2C%20Fraser%20Town%2C%20Bengaluru%20560005&output=embed"></iframe>
      <p><a href="https://www.google.com/maps/dir/?api=1&destination=Gold+Signature+Mosque+Road+Fraser+Town+Bengaluru+560005" target="_blank" rel="noopener">Get directions</a></p>
    </div>
  </div>
</section>
<script src="js/main.js"></script>
<script src="js/services-data.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
